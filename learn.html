<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>Learn | 3-Body Integrator Explorer</title>
    <style>
      :root {
        --bg: #05060a;
        --panel: #0d1118;
        --text: #cfd6e6;
        --muted: #8b95a8;
        --line: #1d2433;
        --accent: #ffd166;
        --link: #74c0fc;
      }
      * {
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
        scroll-padding-top: 16px;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 16px/1.65 system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      #app {
        display: grid;
        grid-template-columns: 250px minmax(0, 1fr);
        max-width: 1080px;
        margin: 0 auto;
      }
      .toc {
        position: sticky;
        top: 0;
        align-self: start;
        max-height: 100vh;
        overflow-y: auto;
        padding: 20px 16px;
        border-right: 1px solid var(--line);
        font-size: 14px;
      }
      .toc ol {
        margin: 12px 0 0;
        padding-left: 18px;
      }
      .toc li {
        margin: 4px 0;
      }
      .toc a {
        color: var(--muted);
        text-decoration: none;
      }
      .toc a:hover,
      .toc a.back {
        color: var(--accent);
      }
      main {
        padding: 24px 28px 80px;
        min-width: 0;
      }
      .page-title {
        font-size: 30px;
        margin: 0 0 4px;
      }
      .lede {
        color: var(--muted);
        margin-top: 0;
      }
      section {
        padding-top: 28px;
        border-top: 1px solid var(--line);
        margin-top: 28px;
      }
      section h1 {
        font-size: 24px;
        margin: 0 0 12px;
      }
      h2 {
        font-size: 17px;
        margin: 22px 0 4px;
        color: var(--accent);
      }
      h3 {
        font-size: 18px;
        margin: 22px 0 4px;
      }
      p {
        margin: 10px 0;
      }
      a {
        color: var(--link);
      }
      a.try-it {
        display: inline-block;
        padding: 6px 12px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--panel);
        color: var(--accent);
        text-decoration: none;
        font-size: 14px;
      }
      a.try-it:hover {
        border-color: var(--accent);
      }
      details.deeper {
        margin: 14px 0;
        padding: 8px 14px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--panel);
      }
      details.deeper summary {
        cursor: pointer;
        color: var(--muted);
        font-size: 14px;
      }
      table {
        border-collapse: collapse;
        margin: 14px 0;
        font-size: 15px;
      }
      th,
      td {
        border: 1px solid var(--line);
        padding: 6px 12px;
        text-align: left;
      }
      th {
        color: var(--muted);
        font-weight: 600;
      }
      .math {
        overflow-x: auto;
      }
      .meta {
        color: var(--muted);
        font-size: 14px;
      }
      .references li {
        margin: 8px 0;
        font-size: 14px;
      }
      article {
        padding: 4px 0 8px;
      }
      @media (max-width: 760px) {
        #app {
          grid-template-columns: 1fr;
        }
        .toc {
          position: static;
          max-height: none;
          border-right: 0;
          border-bottom: 1px solid var(--line);
        }
        main {
          padding: 16px;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/learn/main.ts"></script>
  </body>
</html>
